name: NOIRServer
options:
  bundleIdPrefix: com.noir
  deploymentTarget:
    iOS: "16.0"
targets:
  NOIRServer:
    type: application
    platform: iOS
    sources:
      - path: NOIRServer
    settings:
      base:
        INFOPLIST_FILE: NOIRServer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.noir.server
        PRODUCT_NAME: NOIR Server
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
