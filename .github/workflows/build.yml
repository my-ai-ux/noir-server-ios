name: Build NOIR Server IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pillow for Icon
        run: pip3 install --break-system-packages pillow

      - name: Generate NOIR AppIcon
        run: |
          mkdir -p NOIRServer/Assets.xcassets/AppIcon.appiconset
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          size = 1024
          img = Image.new("RGB", (size, size), (13, 13, 18))
          draw = ImageDraw.Draw(img)
          gold = (242, 184, 64)
          draw.rounded_rectangle([54, 54, size-54, size-54], radius=170, outline=gold, width=14)
          w = 95
          left, right, top, bottom = 290, 734, 270, 754
          draw.rectangle([left, top, left+w, bottom], fill=gold)
          draw.rectangle([right-w, top, right, bottom], fill=gold)
          draw.polygon([(left, top), (left+w, top), (right, bottom), (right-w, bottom)], fill=gold)
          img.save("NOIRServer/Assets.xcassets/AppIcon.appiconset/AppIcon.png")
          EOF

          cat << 'EOF' > NOIRServer/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          cat << 'EOF' > NOIRServer/Assets.xcassets/Contents.json
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project NOIRServer.xcodeproj \
            -scheme NOIRServer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NOIRServer.app Payload/
          zip -r NOIRServer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOIRServer-IPA
          path: NOIRServer.ipa
