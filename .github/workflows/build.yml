name: Build NOIR Server IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Pillow for Icon
        run: pip3 install --break-system-packages pillow

      - name: Generate NOIR AppIcon
        run: |
          mkdir -p NOIRServer/Assets.xcassets/AppIcon.appiconset
          python3 - << 'EOF'
          from PIL import Image, ImageDraw
          size = 1024
          img = Image.new("RGB", (size, size), (10, 15, 28))
          draw = ImageDraw.Draw(img)
          # تدرج لوني عصري للإطار والشعار (Cyan & Violet)
          for i in range(size):
              r = int(10 + (25 * i / size))
              g = int(15 + (20 * i / size))
              b = int(30 + (45 * i / size))
              draw.line([(0, i), (size, i)], fill=(r, g, b))
          cyan = (0, 212, 255)
          violet = (139, 92, 246)
          draw.rounded_rectangle([48, 48, size-48, size-48], radius=180, outline=violet, width=10)
          draw.rounded_rectangle([68, 68, size-68, size-68], radius=165, outline=cyan, width=14)
          w = 95
          left, right, top, bottom = 290, 734, 270, 754
          draw.rectangle([left, top, left+w, bottom], fill=cyan)
          draw.rectangle([right-w, top, right, bottom], fill=cyan)
          draw.polygon([(left, top), (left+w, top), (right, bottom), (right-w, bottom)], fill=(255, 255, 255))
          img.save("NOIRServer/Assets.xcassets/AppIcon.appiconset/AppIcon.png")
          EOF

          cat << 'EOF' > NOIRServer/Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          cat << 'EOF' > NOIRServer/Assets.xcassets/Contents.json
          {
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project NOIRServer.xcodeproj \
            -scheme NOIRServer \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/NOIRServer.app Payload/
          zip -r NOIRServer.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOIRServer-IPA
          path: NOIRServer.ipa
